<script id="chart-configs-data" type="application/json">
    {{ (report.charts if report.charts else []) | tojson }}
</script>

<script>
    const GEOJIT_NAVY = "#00234b";
    const GEOJIT_RED = "#e31837";

    function renderChart(config) {
        const dom = document.getElementById(config.id);
        if (!dom) return;

        if (typeof echarts === 'undefined') {
            const rows = config.series.map(s => `<div><strong>${s.name}</strong>: ${s.data.join(', ')}</div>`).join('');
            dom.innerHTML = `<div class="chart-fallback"><strong>${config.title}</strong>${rows}</div>`;
            return;
        }
        
        let eChart = echarts.init(dom, null, {renderer: 'svg'});
        
        let isDualAxis = config.type === 'dual_axis' || config.type === 'bar_line';
        
        let series = config.series.map((s, idx) => {
            let color = idx === 0 ? GEOJIT_NAVY : GEOJIT_RED;
            return {
                name: s.name,
                type: s.type,
                data: s.data,
                yAxisIndex: s.yAxisIndex || 0,
                itemStyle: { color: color },
                lineStyle: { width: 2 },
                symbol: 'circle',
                symbolSize: s.type === 'line' ? 6 : 0,
                barWidth: s.type === 'bar' ? '40%' : undefined
            };
        });

        let yAxis = [];
        if (isDualAxis) {
            yAxis = [
                { type: 'value', name: config.series[0].name, position: 'left', nameTextStyle: {color: GEOJIT_NAVY}, axisLine: {show: true, lineStyle: {color: GEOJIT_NAVY}}, splitLine: {show: true, lineStyle: {type: 'dashed'}} },
                { type: 'value', name: config.series[1].name, position: 'right', nameTextStyle: {color: GEOJIT_RED}, axisLine: {show: true, lineStyle: {color: GEOJIT_RED}}, splitLine: {show: false} }
            ];
        } else {
            yAxis = [
                { type: 'value', name: config.series[0].name, position: 'left', nameTextStyle: {color: GEOJIT_NAVY}, axisLine: {show: true, lineStyle: {color: GEOJIT_NAVY}}, splitLine: {show: true, lineStyle: {type: 'dashed'}} }
            ];
        }

        eChart.setOption({
            animation: false,
            title: { text: config.title, textStyle: {fontSize: 12, color: GEOJIT_NAVY} },
            tooltip: { trigger: 'axis' },
            xAxis: { type: 'category', data: config.x },
            yAxis: yAxis,
            series: series
        });
    }

    try {
        const chartDataEl = document.getElementById('chart-configs-data');
        const chartConfigs = chartDataEl && chartDataEl.textContent ? JSON.parse(chartDataEl.textContent) : [];
        chartConfigs.forEach(cfg => renderChart(cfg));
    } catch(e) {
        console.error("Error rendering charts: ", e);
    }
</script>
