services:
  web:
    build: .
    image: billeyeee-research:latest
    container_name: billeyeee
    platform: linux/amd64
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      GENERATION_MAX_CONCURRENT: "1"
      OCR_MAX_WORKERS: "1"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./tmp:/app/tmp
    mem_limit: 768m
    mem_reservation: 512m
    cpus: "1.0"
    shm_size: "256mb"
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
